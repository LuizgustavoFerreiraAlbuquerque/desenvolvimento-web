<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #222; color: white; }
    .lampada { width: 120px; height: 120px; border-radius: 50%; background-color: #555; margin-bottom: 20px; transition: background-color 0.3s, box-shadow 0.3s; }
    .lampada.ligada { background-color: #001969; box-shadow: 0 0 40px #001969; }
    button { padding: 10px 24px; font-size: 1rem; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <div id="lampada" class="lampada"></div>
  <button id="btn-toggle">Ligar</button>

  <script>
  // Seleciona os elementos
  const lampada = document.getElementById("lampada");
  const botao = document.getElementById("btn-toggle");
  const corpo = document.body;

  // Estado da lanterna
  let ligada = false;

  // Evento de clique
  botao.addEventListener("click", function () {
    ligada = !ligada;

    if (ligada) {
      // Liga a lanterna
      lampada.classList.add("ligada");
      corpo.style.color = "#222";
      botao.textContent = "Desligar";
    } else {
      // Desliga a lanterna
      lampada.classList.remove("ligada");
      corpo.style.backgroundColor = "#222";
      corpo.style.color = "white";
      botao.textContent = "Ligar";
    }
  });
  </script>
</body>
</html>
